<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Deposit Received — MOCOF</title>
<style>
  *, *::before, *::after {
    margin: 0; padding: 0; box-sizing: border-box;
    -webkit-font-smoothing: antialiased;
  }
  html, body {
    width: 100%; min-height: 100%;
    background: #f7f7f7;
    font-family: -apple-system, BlinkMacSystemFont,
                 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    padding: 36px 28px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .check {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
  }
  .check svg { width: 26px; height: 26px; }
  h1 {
    font-size: 19px;
    font-weight: 600;
    color: #111111;
    margin-bottom: 10px;
  }
  p {
    font-size: 14px;
    color: #555555;
    line-height: 1.5;
    margin-bottom: 6px;
  }
  .ref {
    display: inline-block;
    margin-top: 16px;
    padding: 8px 14px;
    background: #f2f2f2;
    border-radius: 8px;
    font-size: 12px;
    color: #333333;
    font-family: 'SFMono-Regular', Consolas, monospace;
    word-break: break-all;
  }
  .hint {
    margin-top: 18px;
    font-size: 12px;
    color: #999999;
  }
  a.back {
    display: inline-block;
    margin-top: 22px;
    font-size: 13px;
    color: #000000;
    text-decoration: none;
    border-bottom: 1px solid #cccccc;
    padding-bottom: 1px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="check">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M5 13l4 4L19 7" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Deposit received</h1>
    <p>Thank you — your reservation deposit has been received.</p>
    <p>We'll be in touch shortly to confirm your site survey and next steps.</p>
    <div id="ref" class="ref" style="display:none;"></div>
    <p class="hint">A payment confirmation has also been sent to the email you used at checkout.</p>
    <a class="back" href="/widget">Back to chat</a>
  </div>

  <script>
    // Stripe appends ?session_id={CHECKOUT_SESSION_ID} to this page's URL
    // (see success_url in api/create-deposit.js). This is display-only —
    // the deposit itself is already confirmed server-side by
    // api/stripe-webhook.js before this page ever loads, so nothing here
    // needs to call Stripe or any API to "finish" the payment.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var sessionId = params.get('session_id');
      if (sessionId) {
        var el = document.getElementById('ref');
        el.textContent = 'Reference: ' + sessionId;
        el.style.display = 'inline-block';
      }
    })();
  </script>
</body>
</html>
